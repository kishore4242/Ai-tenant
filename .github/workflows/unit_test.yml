name: Auth Service CI

on:
  push:
    branches: ["main"]
    paths:
      - 'auth-service/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'auth-service/**'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build auth-service
        run: mvn clean verify -pl auth-service -am
