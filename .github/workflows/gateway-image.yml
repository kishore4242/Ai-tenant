name: Build and Push Gateway Service

on:
  push:
    branches:
      - main
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gateway

    permissions:
      contents: read

    outputs:
      version: ${{ steps.semver.outputs.version }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Required for git history used in semantic versioning

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          mvn -version

      # Derive semantic version from git tags (e.g., v1.2.3 → 1.2.3)
      # Falls back to 0.0.0-<short-sha> if no tag exists yet
      - name: Derive semantic version
        id: semver
        run: |
          RAW=$(git describe --tags --match "v[0-9]*" --abbrev=7 2>/dev/null || echo "")
          if [ -z "$RAW" ]; then
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          else
            # git describe output: v1.2.3 → 1.2.3  |  v1.2.3-5-gabcdef0 → 1.2.3-5-gabcdef0
            VERSION="${RAW#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Build Gateway
        run: mvn clean package -DskipTests

      # Upload the JAR so the docker job can use it without rebuilding
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-jar
          path: gateway/target/*.jar
          retention-days: 1

  push-image:
    runs-on: ubuntu-latest
    needs: build-and-test

    # Only push on merges to main, not on pull request builds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: gateway-jar
          path: gateway/target

      # Fail fast with a clear message if secrets are missing
      - name: Validate Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "::error::Secret DOCKERHUB_USERNAME is not set. Go to Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Secret DOCKERHUB_TOKEN is not set. Generate one at hub.docker.com → Account Settings → Personal access tokens"
            exit 1
          fi
          echo "Secrets present ✓"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gateway:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gateway:${{ needs.build-and-test.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prints the image digest (sha256:...) — useful for pinning in docker-compose / k8s
      - name: Print image digest
        run: echo "Image digest → ${{ steps.docker_build.outputs.digest }}"
