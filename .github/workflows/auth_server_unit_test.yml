name: Auth Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'auth/**'

jobs:
  build:
    name: Build auth Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Maven Tests
        working-directory: ./auth
        run: mvn clean test
