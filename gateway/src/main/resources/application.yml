server:
  port: 8080

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    config:
      enabled: false

  redis:
    host: localhost
    port: 6379
    timeout: 2000

jwt:
  secret: ${JWTSECRET}

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty.http.client: DEBUG
    org.springframework.web.reactive: DEBUG

rate-limiter:
  capacity: 10
  refill: 5
  timeout: 2000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka